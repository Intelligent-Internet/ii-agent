[package]
name = "pptx_processor"
version = "0.1.0"
edition = "2021"
description = "WASI preview1 module for the desktop pptx skill. Extracts slide text from PowerPoint containers using zip + quick-xml."
license = "MIT"

[[bin]]
name = "pptx_processor"
path = "src/main.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.36", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
