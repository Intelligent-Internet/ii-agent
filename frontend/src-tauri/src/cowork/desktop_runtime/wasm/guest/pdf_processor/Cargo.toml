[package]
name = "pdf_processor"
version = "0.1.0"
edition = "2021"
description = "WASI preview1 module for desktop pdf skill. Runs inside the wasmtime sandbox owned by cowork desktop runtime."
license = "MIT"

[[bin]]
name = "pdf_processor"
path = "src/main.rs"

[dependencies]
lopdf = { version = "0.36", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
