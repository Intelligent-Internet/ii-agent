# ─────────────────────────────────────────────
# Capital Allocation Framework
# ─────────────────────────────────────────────
capital_allocation:
  strategy: >
    Acquire high-quality infrastructure assets at value; fund through
    asset recycling and retained cash flow; target 12-15% total return
    composed of 5-9% distribution growth + 3-4% organic FFO growth
    + value-enhancing capital deployment.

  funding_sources:
    - retained_cash_flow
    - asset_recycling         # sell mature assets at premium
    - equity_issuance         # primarily BIPC shares
    - debt_at_asset_level     # non-recourse project finance
    - brookfield_co_investment

  return_composition:
    distribution_yield: "4-6% current"
    distribution_growth: "5-9% annually (management target)"
    total_return_target: "12-15%"

  asset_recycling_philosophy: >
    Sell de-risked, mature assets to lower-cost-of-capital buyers (pensions,
    sovereign wealth). Redeploy proceeds into higher-return greenfield or
    value-add opportunities. Typical hold period: 7-10 years.

# ─────────────────────────────────────────────
# Distribution / Payout Analysis
# ─────────────────────────────────────────────
distribution_framing:
  key_questions:
    - Is distribution growth funded by FFO growth or debt/equity issuance?
    - What is the FFO payout ratio trend?
    - How sustainable is the 5-9% growth target?
    - What is the cash tax shield from LP structure depreciation?

  risk_factors:
    - asset_recycling_execution   # dependent on selling assets at premium
    - fx_impact                   # ~50% non-USD earnings
    - interest_rate_sensitivity   # floating rate exposure at asset level
    - concentrated_counterparty   # some large single-counterparty assets
    - brookfield_governance       # BAM as GP introduces alignment questions

  monitoring_kpis:
    - ffo_payout_ratio
    - distribution_coverage_ratio
    - organic_vs_acquisition_ffo_growth
    - debt_maturity_profile

# ─────────────────────────────────────────────
# Leverage & Refinancing Watchlist
# ─────────────────────────────────────────────
leverage_profile:
  structure: >
    Non-recourse, asset-level debt. No material corporate-level debt
    at BIP partnership. Each operating entity has standalone financing.

  key_metrics_to_track:
    - proportionate_net_debt_to_ebitda
    - weighted_avg_debt_maturity
    - floating_rate_pct
    - near_term_maturities   # next 24 months

  refinancing_watchlist:
    description: >
      Track maturities by segment and size. Flag any maturity > $500M
      within 12 months or any maturity into a rising-rate environment.
    items: []  # populate from supplemental disclosures

