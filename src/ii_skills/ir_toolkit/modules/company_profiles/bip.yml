# ─────────────────────────────────────────────
# LP Q&A Topics (for Q&A simulator)
# ─────────────────────────────────────────────
lp_qa_topics:
  - topic: Distribution sustainability
    likely_questions:
      - "How confident are you in maintaining 5-9% distribution growth?"
      - "What happens to payout ratio if asset recycling slows?"
      - "How much of FFO growth is organic vs. acquisition-driven?"
    evidence_sources: [ffo_per_unit, distribution_growth_rate, ffo_payout_ratio]

  - topic: Interest rate sensitivity
    likely_questions:
      - "What is your floating rate exposure and hedge position?"
      - "How do rising rates affect acquisition economics?"
      - "What is the refinancing risk in the next 24 months?"
    evidence_sources: [debt_to_ebitda, near_term_maturities, floating_rate_pct]

  - topic: Growth quality
    likely_questions:
      - "What is your organic growth rate vs. M&A contribution?"
      - "How does asset recycling create value vs. just maintaining returns?"
      - "Are you seeing competitive pressure on deal multiples?"
    evidence_sources: [organic_growth_rate, capital_allocation]

  - topic: Governance and alignment
    likely_questions:
      - "How do BAM economics align with BIP unitholders?"
      - "What happens if BAM is conflicted on an allocation?"
      - "Why should LPs prefer BIP vs. Brookfield Infrastructure Fund?"
    evidence_sources: [brookfield_governance, capital_allocation]

